# Loads the plugin into the latest ranma release on every push to main and
# every pull request: `ranma --check-config` with a config that does nothing
# but packadd this checkout, and fails if it does not load. A failing plugin is
# only a toast in a real config (ranma's CONFIG.md, "A failing plugin is
# dropped whole"), so init.lua turns packadd's error into a failed check.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The latest ranma release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R masshirodev/ranma -p 'ranma-*-x86_64-unknown-linux-gnu.tar.gz' -D "$RUNNER_TEMP"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP"/ranma-*.tar.gz
          echo "$(dirname "$(find "$RUNNER_TEMP" -name ranma -type f)")" >> "$GITHUB_PATH"
      - name: Loads
        run: |
          cfg="$RUNNER_TEMP/cfg"
          mkdir -p "$cfg"
          cat > "$cfg/init.lua" <<'LUA'
          ranma.set { plugin_manager = "none" }
          local ok, err = ranma.packadd(os.getenv("GITHUB_WORKSPACE"))
          if not ok then error("the plugin did not load: " .. tostring(err)) end
          LUA
          ranma --version
          XDG_RUNTIME_DIR="$RUNNER_TEMP/rt" XDG_STATE_HOME="$RUNNER_TEMP/state" \
            RANMA_CONFIG_DIR="$cfg" RANMA_NO_UPDATE_CHECK=1 ranma --check-config
